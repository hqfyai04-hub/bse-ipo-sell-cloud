services:
  - type: web
    name: bse-ipo-sell-cloud
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bse-ipo-sell-db
          property: connectionString

databases:
  - name: bse-ipo-sell-db
    plan: free
