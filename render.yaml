services:
  - type: web
    name: bse-ipo-sell-cloud
    runtime: docker
    plan: free
    # 离中国最近的区域，降低腾讯/东方财富行情接口的延迟与被限风险
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # github.io 前端跨域必需；该域名固定，直接写死
      - key: APP_ALLOWED_ORIGINS
        value: https://hqfyai04-hub.github.io
      # 不设置则为公开只读（protect 在令牌为空时放行，仅保留限流）
      - key: APP_ACCESS_TOKEN
        sync: false
      # 不设置 DATABASE_URL 时，store 自动降级到临时 SQLite，足够无状态取行情使用
