<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>网络不可用</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,"Microsoft YaHei",sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#07111f; color:#eff7ff; }
    main { width:min(480px,calc(100% - 36px)); padding:28px; border:1px solid rgba(175,202,230,.16); border-radius:18px; background:#0d1a2b; }
    strong { color:#ffbf69; font-size:13px; letter-spacing:.08em; }
    h1 { margin:12px 0; font-size:29px; }
    p { color:#8fa5ba; line-height:1.7; }
    button { width:100%; min-height:48px; border:0; border-radius:10px; background:#4ce2d4; color:#04141d; font-weight:800; }
  </style>
</head>
<body>
  <main>
    <strong>行情连接已中断</strong>
    <h1>需要联网才能判断卖出窗口</h1>
    <p>应用外壳可以离线打开，但实时价格、VWAP、换手和上市资料不能离线生成。请恢复网络后重试，并以券商终端为准。</p>
    <button type="button" onclick="location.reload()">重新连接</button>
  </main>
</body>
</html>
